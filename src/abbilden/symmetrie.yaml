# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Symmetrie
description: Achsen-, Punkt- und Drehsymmetrie bei Figuren erkennen.
competencies: [symmetrie]
blocks:
  - type: section
    id: einstieg
    title: Falten und Klecksbild
    blocks:
      - type: text
        text: |
          Nika und Jonas lesen den achten Hinweis: Ihre Schatzkarte ist an einer Faltlinie zerrissen. Du lernst hier, Symmetrien zu erkennen, damit Nika und Jonas die zweite Hälfte finden.
          Falte ein Blatt Papier in der Mitte, tropfe Farbe auf eine Hälfte und klappe zu. Es entsteht ein Klecksbild mit zwei gleichen Hälften.
      - type: single-choice
        id: faltlinie
        text: Du faltest ein Quadrat entlang der Linie, die zwei gegenüberliegende Ecken verbindet. Liegen die beiden Hälften genau aufeinander?
        options:
          - text: Ja, genau aufeinander.
            correct: true
            info: Richtig. Beim Quadrat liegen beide Hälften nach dem Falten genau aufeinander.
          - text: Nein, eine Hälfte steht über.
            correct: false
            info: Beim Quadrat ist das nicht so. Probiere es mit einem Blatt Papier aus.
        explanation: Wo du faltest und beide Hälften genau aufeinanderliegen, liegt eine Symmetrieachse. Beim Quadrat gilt das für diese Linie.
      - type: figure
        image: images/symmetrie-beispiele.svg
        alt: Ein Rechteck mit zwei gestrichelten Faltlinien, ein Quadrat mit vier und ein Dreieck mit zwei gleich langen Seiten und einer Achse.
        caption: Die gestrichelten Linien sind Symmetrieachsen.
        source: eigene Zeichnung
        licence: CC-BY-4.0
  - type: section
    id: erklaerung
    title: Drei Arten von Symmetrie
    blocks:
      - type: text
        text: |
          Wenn du wissen willst, ob zwei Hälften einer Figur genau zusammenpassen, suchst du nach einer Symmetrie. Es gibt drei Arten.
          Eine Figur ist **achsensymmetrisch**, wenn sie eine **Symmetrieachse** hat. Eine **Diagonale** ist eine Linie zwischen zwei gegenüberliegenden Ecken. Faltest du an dieser Linie, liegen beide Hälften genau aufeinander.
          Eine Figur ist **punktsymmetrisch**, wenn du sie um einen Punkt halb herumdrehen kannst, also um 180°, und sie dann wieder genauso aussieht.
          Eine Figur ist **drehsymmetrisch**, wenn du sie um einen Punkt um weniger als eine ganze Drehung drehen kannst und sie wieder genauso aussieht. Die kleinste solche Drehung ist ihr Drehwinkel. Ein Dreieck mit drei gleich langen Seiten heißt gleichseitig. Ein Vieleck mit gleich langen Seiten und gleich großen Winkeln heißt regelmäßig. Bei einem regelmäßigen Vieleck mit n Ecken gibt es n Achsen, und die kleinste Drehung ist 360° : n groß. Ist eine Figur punktsymmetrisch, ist sie auch drehsymmetrisch, mit einer halben Drehung.
      - type: table
        caption: Symmetrie bei einigen Figuren
        header: [Figur, Achsen, punktsymmetrisch, kleinster Drehwinkel]
        rowHeaders: true
        rows:
          - [Rechteck (kein Quadrat), "2", ja, 180°]
          - [Quadrat, "4", ja, 90°]
          - ["gleichseitiges Dreieck (drei gleich lange Seiten)", "3", nein, 120°]
          - [Parallelogramm (schief), "0", ja, 180°]
      - type: definition
        term: Symmetrieachse
        explanation: Eine Symmetrieachse ist eine Linie, an der du eine Figur falten kannst, sodass beide Hälften genau aufeinanderliegen.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Die Diagonale eines Rechtecks ist keine Symmetrieachse. Beim Falten an ihr liegen die Hälften nicht aufeinander.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Das gleichseitige Dreieck
        blocks:
          - type: text
            text: Es hat drei Symmetrieachsen. Dreht du es um 120°, sieht es wieder aus wie vorher. Es ist drehsymmetrisch, aber nicht punktsymmetrisch.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: text
        text: "Mit diesen Aufgaben prüfst du, ob du Symmetrien erkennst und nutzt."
      - type: matching
        id: achsen-zuordnen
        text: Wie viele Symmetrieachsen hat die Figur?
        pairs:
          - { left: Quadrat, right: vier Achsen }
          - { left: Rechteck (kein Quadrat), right: zwei Achsen }
          - { left: gleichseitiges Dreieck, right: drei Achsen }
          - { left: Parallelogramm (schief), right: keine Achse }
        explanation: Falte in Gedanken in jede Richtung. Wo beide Hälften genau aufeinanderliegen, ist eine Achse.
      - type: multiple-choice
        id: punktsymmetrisch
        text: Welche Figuren sind punktsymmetrisch?
        options:
          - text: Rechteck
            correct: true
            info: Richtig. Nach einer halben Drehung um die Mitte sieht es wieder gleich aus.
          - text: Parallelogramm
            correct: true
            info: Richtig. Auch das schiefe Parallelogramm sieht nach einer halben Drehung gleich aus.
          - text: gleichseitiges Dreieck
            correct: false
            info: Nach einer halben Drehung steht es auf dem Kopf. Es ist nur drehsymmetrisch mit 120°.
          - text: Quadrat
            correct: true
            info: Richtig. Es sieht schon nach einer Vierteldrehung gleich aus, also auch nach einer halben.
        explanation: Punktsymmetrisch heißt, nach einer halben Drehung sieht die Figur wieder gleich aus.
      - type: generated
        id: achsen-n-eck
        given:
          n: { oneOf: [3, 4, 5, 6, 8] }
        task:
          text: "Ein regelmäßiges Vieleck hat {{n}} Ecken. Wie viele Symmetrieachsen hat es?"
        answer: { value: "n", compare: number }
        mistakes:
          - {
              value: "n - 1",
              message: "Du hast eine Achse vergessen. Es gibt so viele Achsen wie Ecken: Bei einem Dreieck geht jede Achse durch eine Ecke und die Mitte der gegenüberliegenden Seite.",
            }
          - {
              value: "2 * n",
              message: "Du hast zu viele Achsen gezählt. Eine Achse durch die Mitte zählt nur einmal, auch wenn sie zwei Ecken berührt.",
            }
        hint: "Zeichne ein Dreieck oder ein Quadrat und zähle die Achsen. Welcher Zusammenhang mit der Zahl der Ecken fällt dir auf?"
        steps:
          - "Bei einem regelmäßigen Vieleck mit {{n}} Ecken gibt es genau so viele Achsen wie Ecken."
          - "Das sind {{answer}} Achsen."
      - type: generated
        id: drehwinkel-n-eck
        given:
          n: { oneOf: [3, 4, 5, 6, 8, 9, 10] }
        task:
          text: "Ein regelmäßiges Vieleck mit {{n}} Ecken wird um seinen Mittelpunkt gedreht, bis es zum ersten Mal wieder genauso aussieht. Wie groß ist diese kleinste Drehung in Grad?"
        answer: { value: "360 / n", compare: { number: { unit: "°" } } }
        mistakes:
          - {
              value: "180 / n",
              message: "Du hast durch 180 geteilt. Eine ganze Drehung hat 360°, die teilst du durch die Zahl der Ecken.",
            }
          - { value: "n", message: "Das ist die Zahl der Ecken. Gefragt ist der Winkel der Drehung in Grad." }
        hint: "Nach n gleichen Drehungen ist eine ganze Drehung von 360° geschafft."
        steps:
          - "Eine ganze Drehung hat 360°. Das Vieleck sieht nach {{n}} gleichen Drehungen wieder aus."
          - "360° : {{n}} = {{answer}}°."
