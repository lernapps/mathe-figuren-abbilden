# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Wiederholung der natürlichen Zahlen mit Selbsttest, damit du weißt, ob du für das Koordinatensystem bereit bist.
recap: [mathematik/natuerliche-zahlen]
blocks:
  - type: section
    id: wofuer
    title: Das brauchst du für dieses Kapitel
    blocks:
      - type: text
        text: |
          Im Koordinatensystem gibst du Punkte mit Zahlen an. Dafür musst du Zahlen sicher lesen, schreiben und am Zahlenstrahl finden.
          Zwei Kurzaufgaben zeigen dir, ob du bereit bist.
  - type: section
    id: natuerliche-zahlen
    title: Natürliche Zahlen im Stellenwertsystem
    blocks:
      - type: text
        text: |
          Die **natürlichen Zahlen** sind 0, 1, 2, 3 und so weiter, immer eine mehr. Am **Zahlenstrahl** siehst du sie der Größe nach: Je weiter rechts, desto größer.
          Der **Stellenwert** sagt, was eine Ziffer wert ist: Das hängt von ihrer Stelle ab, Einer, Zehner, Hunderter und so weiter.
      - type: figure
        image: images/zahlenstrahl.svg
        alt: Ein Zahlenstrahl von 0 bis 10 mit einem roten Punkt bei 3. Ein Bogen zeigt drei Schritte von der 0 bis zum Punkt.
        caption: Auf dem Zahlenstrahl liegt die 3 drei Schritte rechts von der 0.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Zahlenstrahl
        explanation: Eine Linie, die bei 0 beginnt und nach rechts weitergeht. Jede natürliche Zahl hat dort ihren Platz.
      - type: definition
        term: Stellenwert
        explanation: "Der Wert einer Ziffer hängt von ihrer Stelle ab. In 305 steht die 3 an der Hunderterstelle und ist 300 wert, die 0 an der Zehnerstelle ist 0 wert, die 5 ist 5 wert."
      - type: example
        title: Die Zahl 305
        blocks:
          - type: text
            text: 305 hat 3 Hunderter, 0 Zehner und 5 Einer. Du rechnest 3 · 100 + 0 · 10 + 5 · 1 = 305.
      - type: note
        title: Kannst du das? Aufgabe 1
        blocks:
          - type: text
            text: |
              Du startest bei der 5 auf dem Zahlenstrahl und gehst 3 Schritte nach rechts. Bei welcher Zahl landest du? Rechne zuerst im Kopf, dann lies die Lösung.

              **Lösung:** 8, denn 5 + 3 = 8. Hast du 3 heraus, hast du nur die Schritte gezählt. Hast du 2 heraus, bist du nach links gegangen.
      - type: note
        title: Kannst du das? Aufgabe 2
        blocks:
          - type: text
            text: |
              Welche Zahl hat 4 Hunderter, 2 Zehner und 7 Einer? Schreibe sie auf, dann lies die Lösung.

              **Lösung:** 427, denn 4 · 100 + 2 · 10 + 7 · 1 = 427. Hast du 724 heraus, hast du die Reihenfolge umgedreht. Hast du 13 heraus, hast du die Ziffern addiert.
      - type: text
        text: |
          Klappt eine Aufgabe nicht? Lies den Baustein [Natürliche Zahlen im Stellenwertsystem](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/) auf der Lernlandkarte nach.
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          Ich kann natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen. Für dieses Kapitel heißt das:
          - Du findest eine Zahl wie 3 oder 7 auf dem Zahlenstrahl und gehst von ihr aus nach rechts weiter.
          - Du erklärst, was eine Ziffer an ihrer Stelle wert ist.
          - Du schreibst eine Zahl aus Hundertern, Zehnern und Einern auf.
