# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Zeichnen und Konstruieren
description: Mit Zirkel und Lineal ein Dreieck aus drei Seiten konstruieren.
competencies: [konstruktionen]
blocks:
  - type: section
    id: einstieg
    title: Ein Kreis um den Schatz
    blocks:
      - type: text
        text: |
          Der siebte Hinweis der Karte ist ein Kreis um den Schatzpunkt, den du mit dem Zirkel zeichnest. Du lernst hier, mit dem Zirkel zu konstruieren und ein Dreieck aus seinen drei Seiten zu zeichnen.
          Das baut auf Strecken und Figuren der Seiten davor auf.
      - type: single-choice
        id: zirkel-kreis
        text: Du stichst den Zirkel in den Punkt M, stellst ihn auf 3 cm ein und zeichnest einen Kreis. Wie weit ist jeder Punkt des Kreises von M entfernt?
        options:
          - text: 3 cm
            correct: true
            info: Richtig. Der Zirkel bleibt gleich weit geöffnet, also hat jeder Punkt den gleichen Abstand von M.
          - text: 6 cm
            correct: false
            info: 6 cm ist die Breite des ganzen Kreises. Der Abstand von M ist die Hälfte davon.
          - text: Das ist bei jedem Punkt anders.
            correct: false
            info: Der Zirkel ändert seine Öffnung nicht. Darum sind alle Abstände gleich.
        explanation: Alle Punkte eines Kreises haben denselben Abstand zum Mittelpunkt. Das ist die Öffnung des Zirkels.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/konstruktionen/
  - type: section
    id: erklaerung
    title: Ein Dreieck aus drei Seiten
    blocks:
      - type: figure
        image: images/dreieck-konstruktion.svg
        alt: Eine Strecke AB. Um A und um B ist je ein Kreisbogen gezeichnet. Beide Bögen schneiden sich im Punkt C. Von C führen Strecken zu A und B und bilden ein Dreieck.
        caption: Zwei Kreisbögen treffen sich im Punkt C.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Die Seiten heißen nach der Ecke, die ihnen gegenübersteht: a ist die Strecke BC, b die Strecke AC und c die Strecke AB.
          Du kennst die drei Seiten a, b und c. Zeichne zuerst die Strecke c mit den Endpunkten A und B.
          Der **Radius** ist der Abstand vom Mittelpunkt zum Kreis, also die Öffnung des Zirkels. Stelle den Zirkel auf b ein und zeichne einen Kreisbogen um A. Stelle ihn auf a ein und zeichne einen Kreisbogen um B.
          Ein **Kreisbogen** ist ein Stück eines Kreises. Dort, wo sich die Bögen schneiden, liegt der Punkt C, ihr **Schnittpunkt**. Verbinde C mit A und B.
      - type: definition
        term: Radius
        explanation: Der Radius ist der Abstand vom Mittelpunkt eines Kreises zum Kreis. Er ist die Öffnung des Zirkels.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Der Zirkel muss genau auf die Länge der Seite eingestellt sein. Prüfe die Öffnung vor dem Zeichnen am Lineal. Sind die Seiten zu kurz, reichen die Bögen nicht bis zueinander, und es entsteht kein Dreieck.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Dreieck mit a = 4 cm, b = 3 cm, c = 5 cm
        blocks:
          - type: text
            text: Zeichne c = 5 cm. Öffne den Zirkel auf 3 cm und ziehe einen Bogen um A. Öffne ihn auf 4 cm und ziehe einen Bogen um B. Verbinde den Schnittpunkt C mit A und B.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: ordering
        id: dreieck-schritte
        text: Bringe die Schritte in die richtige Reihenfolge, um ein Dreieck aus drei Seiten zu konstruieren.
        items:
          - Zeichne die Strecke c mit den Endpunkten A und B.
          - "Zeichne die beiden Kreisbögen: um A mit dem Radius b (Strecke AC) und um B mit dem Radius a (Strecke BC)."
          - Verbinde den Schnittpunkt C der Bögen mit A und B.
        explanation: Zuerst brauchst du die Grundstrecke. Dann zeichnest du die beiden Bögen. Erst am Schluss verbindest du die Punkte.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/konstruktionen/
      - type: generated
        id: zirkel-einstellen
        given:
          a: { int: [3, 7], step: 1 }
          b: { int: [3, 7], step: 1 }
          c: { int: [3, 7], step: 1 }
        where: ["a != b", "b != c", "a != c", "a + b > c", "a + c > b", "b + c > a"]
        task:
          text: "Du konstruierst ein Dreieck mit a = {{a}} cm, b = {{b}} cm und c = {{c}} cm. Du hast die Strecke c = AB gezeichnet. Auf wie viel cm stellst du den Zirkel für den Bogen um A ein?"
        answer: { value: "b", compare: { number: { unit: cm } } }
        mistakes:
          - {
              value: "a",
              message: "Das ist der Radius für den Bogen um B. Der Bogen um A hat den Radius b, denn b ist die Strecke AC.",
            }
          - {
              value: "c",
              message: "c ist die Grundstrecke, die schon gezeichnet ist. Für den Bogen um A brauchst du die Seite b.",
            }
        hint: "Um A zeichnest du den Bogen mit der Seite b, um B den mit der Seite a."
        steps:
          - "Die Seite b gehört zum Bogen um A. Sie ist {{b}} cm lang."
          - "Du stellst den Zirkel auf {{answer}} cm ein."
      - type: single-choice
        id: dreieck-unmoeglich
        text: Du willst ein Dreieck mit den Seiten 2 cm, 3 cm und 8 cm konstruieren. Was passiert?
        options:
          - text: Die beiden Bögen schneiden sich nicht, das Dreieck gibt es nicht.
            correct: true
            info: Richtig. Die Bögen von 2 cm und 3 cm reichen von den Enden der 8-cm-Strecke nicht bis zueinander.
          - text: Die Bögen schneiden sich genau einmal.
            correct: false
            info: Dazu müssten 2 cm und 3 cm zusammen mindestens 8 cm lang sein. Das sind nur 5 cm.
          - text: Du bekommst ein Dreieck, wenn du den Zirkel weiter öffnest.
            correct: false
            info: Dann wären die Seiten nicht mehr 2 cm und 3 cm.
        explanation: Die Bögen von 2 cm und 3 cm reichen von den Enden der 8-cm-Strecke nicht bis zueinander. Sie treffen sich nicht, also gibt es kein Dreieck.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/konstruktionen/
