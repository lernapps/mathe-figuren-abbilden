# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Wiederholung der natürlichen Zahlen mit Selbsttest, damit du weißt, ob du für das Koordinatensystem bereit bist.
recap: [mathematik/natuerliche-zahlen]
blocks:
  - type: section
    id: wofuer
    title: Wofür diese Seite da ist
    blocks:
      - type: text
        text: |
          Im Kapitel „Punkte, Linien und Koordinaten“ gibst du Punkte mit Zahlen an. Dafür musst du Zahlen sicher lesen, schreiben und am Zahlenstrahl finden.
          Zwei Kurzaufgaben zeigen dir, ob du bereit bist. Hast du beide richtig, kannst du gleich weiter.
  - type: section
    id: natuerliche-zahlen
    title: Natürliche Zahlen im Stellenwertsystem
    blocks:
      - type: figure
        image: images/zahlenstrahl.svg
        alt: Ein Zahlenstrahl von 0 bis 10 mit einem roten Punkt bei 3. Drei kleine Bögen zeigen drei Schritte von der 0 bis zum Punkt.
        caption: Die Zahl 3 liegt drei Schritte rechts von der 0.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: natürliche Zahlen
        explanation: "Die Zahlen, mit denen du zählst: 0, 1, 2, 3 und so weiter. Jede ist um 1 größer als die davor. Zum Beispiel sind 7 und 305 natürliche Zahlen."
      - type: definition
        term: Ziffer
        explanation: Eins der zehn Zeichen 0 bis 9, aus denen du Zahlen schreibst. Die Zahl 305 besteht aus den Ziffern 3, 0 und 5.
      - type: definition
        term: Zahlenstrahl
        explanation: Eine Linie, die bei 0 beginnt und nach rechts weitergeht. Die Marken haben gleiche Abstände. Jede natürliche Zahl hat dort ihren Platz, und je weiter rechts sie liegt, desto größer ist sie.
      - type: definition
        term: Stellenwert
        explanation: "Der Stellenwert ist der Wert einer Stelle: 1 bei den Einern, 10 bei den Zehnern, 100 bei den Hundertern und so weiter. Eine Ziffer ist so viel wert wie die Ziffer mal der Stellenwert ihrer Stelle. In 305 ist die 3 an der Hunderterstelle 3 · 100 = 300 wert, die 5 ist 5 · 1 = 5 wert."
      - type: example
        title: Die Zahl 305
        blocks:
          - type: text
            text: 305 hat 3 Hunderter, 0 Zehner und 5 Einer. Du rechnest 3 · 100 + 0 · 10 + 5 · 1 = 305.
      - type: note
        title: Kannst du das? Aufgabe 1
        blocks:
          - type: text
            text: |
              Du startest bei der 5 auf dem Zahlenstrahl und gehst 3 Schritte nach rechts. Bei welcher Zahl landest du? Rechne zuerst im Kopf, dann lies die Lösung.

              **Lösung:** 8, denn 5 + 3 = 8. Hast du 3 heraus, hast du nur die Schritte gezählt. Hast du 2 heraus, bist du nach links gegangen. Hast du 9 heraus, hast du die 5 schon als ersten Schritt mitgezählt.
      - type: note
        title: Kannst du das? Aufgabe 2
        blocks:
          - type: text
            text: |
              Welche Zahl hat 4 Hunderter, 2 Zehner und 7 Einer? Schreibe sie auf, dann lies die Lösung.

              **Lösung:** 427, denn 4 · 100 + 2 · 10 + 7 · 1 = 427. Hast du 724 heraus, hast du die Reihenfolge umgedreht. Hast du 13 heraus, hast du die Ziffern addiert.
      - type: text
        text: |
          Klappt eine Aufgabe nicht? Lies den Abschnitt oben noch einmal. Mehr dazu steht beim Baustein [Natürliche Zahlen im Stellenwertsystem](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/) auf der Lernlandkarte von lernapps.net.
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          Die Lernlandkarte nennt als Ziel: Ich kann natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen. Für dieses Kapitel genügt davon, dass du
          - eine Zahl wie 3 oder 7 am Zahlenstrahl findest und von ihr aus nach rechts weitergehst,
          - erklärst, was eine Ziffer an ihrer Stelle wert ist, und
          - eine Zahl aus Hundertern, Zehnern und Einern aufschreibst.
