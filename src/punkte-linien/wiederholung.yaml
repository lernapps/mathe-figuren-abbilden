# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Wiederholung der natürlichen Zahlen mit Selbsttest, damit du weißt, ob du für das Koordinatensystem bereit bist.
recap: [mathematik/natuerliche-zahlen]
blocks:
  - type: section
    id: wofuer
    title: Wofür diese Seite da ist
    blocks:
      - type: text
        text: |
          Im Kapitel „Punkte, Linien und Koordinaten“ gibst du Punkte mit Zahlen an. Dafür musst du Zahlen sicher lesen, schreiben und am Zahlenstrahl finden.
          Drei Kurztests zeigen dir, ob du bereit bist. Hast du alle drei richtig, kannst du gleich weiter.
  - type: section
    id: natuerliche-zahlen
    title: Natürliche Zahlen im Stellenwertsystem
    blocks:
      - type: figure
        image: images/zahlenstrahl.svg
        alt: Ein Zahlenstrahl von 0 bis 10 mit einem roten Punkt bei 3. Drei kleine Bögen zeigen drei Schritte von der 0 bis zum Punkt.
        caption: Die Zahl 3 liegt drei Schritte rechts von der 0.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: natürliche Zahlen
        explanation: "Die Zahlen, mit denen du zählst: 0, 1, 2, 3 und so weiter. Jede ist um 1 größer als die davor. Zum Beispiel sind 7 und 305 natürliche Zahlen."
      - type: definition
        term: Ziffer
        explanation: Eins der zehn Zeichen 0 bis 9, aus denen du Zahlen schreibst. Die Zahl 305 besteht aus den Ziffern 3, 0 und 5.
      - type: definition
        term: Zahlenstrahl
        explanation: Eine Linie, die bei 0 beginnt und nach rechts weitergeht. Die Marken haben gleiche Abstände. Jede natürliche Zahl hat dort ihren Platz, und je weiter rechts sie liegt, desto größer ist sie.
      - type: definition
        term: Stellenwert
        explanation: "Der Stellenwert ist der Wert einer Stelle: 1 bei den Einern, 10 bei den Zehnern, 100 bei den Hundertern und so weiter. Eine Ziffer ist so viel wert wie die Ziffer mal der Stellenwert ihrer Stelle. In 305 ist die 3 an der Hunderterstelle 3 · 100 = 300 wert, die 5 ist 5 · 1 = 5 wert."
      - type: example
        title: Die Zahl 305
        blocks:
          - type: text
            text: 305 hat 3 Hunderter, 0 Zehner und 5 Einer. Du rechnest 3 · 100 + 0 · 10 + 5 · 1 = 305.
      - type: vue-component
        id: test-zahlenstrahl
        component: Kurztest
        props:
          question: "Kannst du das? Du startest bei der 48 auf dem Zahlenstrahl und gehst 37 Schritte nach rechts. Bei welcher Zahl landest du?"
          options:
            - {
                text: "85",
                correct: true,
                info: "48 + 37 = 85. Zerlege: 48 + 30 = 78, dann 78 + 7 = 85. Nach rechts werden die Zahlen größer.",
              }
            - { text: "37", correct: false, info: "Das sind nur die Schritte. Du startest aber bei der 48." }
            - {
                text: "11",
                correct: false,
                info: "Du bist nach links gegangen und hast 48 − 37 gerechnet. Nach rechts musst du addieren.",
              }
            - {
                text: "86",
                correct: false,
                info: "Du hast die 48 schon als ersten Schritt mitgezählt. Die Schritte beginnen erst nach der 48.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Du startest bei der 48 auf dem Zahlenstrahl und gehst 37 Schritte nach rechts. Bei welcher Zahl landest du? Zur Auswahl stehen 85, 37, 11 und 86. Richtig ist 85, denn 48 + 37 = 85 (zerlege: 48 + 30 = 78, dann 78 + 7). Bei 37 hast du nur die Schritte gezählt, bei 11 bist du nach links gegangen, bei 86 hast du die 48 schon mitgezählt.
      - type: vue-component
        id: test-stellenwert
        component: Kurztest
        props:
          question: "Kannst du das? Welche Zahl hat 3 Tausender, 0 Hunderter, 5 Zehner und 8 Einer?"
          options:
            - {
                text: "3058",
                correct: true,
                info: "3 · 1000 + 0 · 100 + 5 · 10 + 8 · 1 = 3058. Die Null hält den Platz der Hunderter frei.",
              }
            - {
                text: "358",
                correct: false,
                info: "Du hast die Null weggelassen. Ohne sie rutschen alle Ziffern eine Stelle nach rechts und die Zahl wird viel kleiner.",
              }
            - {
                text: "3580",
                correct: false,
                info: "Du hast die Null an die falsche Stelle gesetzt. Die Hunderter stehen zwischen den Tausendern und den Zehnern.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welche Zahl hat 3 Tausender, 0 Hunderter, 5 Zehner und 8 Einer? Zur Auswahl stehen 3058, 358 und 3580. Richtig ist 3058, denn 3 · 1000 + 0 · 100 + 5 · 10 + 8 · 1 = 3058. Bei 358 hast du die Null weggelassen, bei 3580 hast du sie an die falsche Stelle gesetzt.
      - type: vue-component
        id: test-ziffernwert
        component: Kurztest
        props:
          question: "Kannst du das? Welchen Wert hat die Ziffer 7 in der Zahl 4705?"
          options:
            - { text: "700", correct: true, info: "Die 7 steht an der Hunderterstelle: 7 · 100 = 700." }
            - {
                text: "7",
                correct: false,
                info: "Das ist die Ziffer selbst. Ihr Wert hängt von der Stelle ab, an der sie steht.",
              }
            - {
                text: "70",
                correct: false,
                info: "Dann stünde die 7 an der Zehnerstelle, wie in 4075. In 4705 stehen rechts von ihr noch zwei Ziffern, die Zehner und die Einer.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welchen Wert hat die Ziffer 7 in der Zahl 4705? Zur Auswahl stehen 700, 7 und 70. Richtig ist 700, denn die 7 steht an der Hunderterstelle: 7 · 100 = 700. Bei 7 hast du nur die Ziffer genannt, bei 70 hast du die Zehnerstelle genommen.
      - type: text
        text: |
          Du darfst jede Antwort noch einmal wählen. Hast du alle drei richtig, bist du bereit. Klappt ein Kurztest nicht, lies den Abschnitt oben noch einmal. Mehr dazu steht beim Baustein [Natürliche Zahlen im Stellenwertsystem](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/) auf der Lernlandkarte von lernapps.net.
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          Die Lernlandkarte nennt als Ziel: Ich kann natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen. Für dieses Kapitel genügt davon, dass du
          - eine Zahl wie 3 oder 7 am Zahlenstrahl findest und von ihr aus nach rechts weitergehst,
          - erklärst, was eine Ziffer an ihrer Stelle wert ist, und
          - eine Zahl aus Hundertern, Zehnern und Einern aufschreibst.
