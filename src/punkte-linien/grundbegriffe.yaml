# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Punkt, Strecke, Gerade
description: Punkt, Strecke, Gerade, Halbgerade und Ebene unterscheiden und richtig benennen.
competencies: [geometrische-grundbegriffe]
blocks:
  - type: section
    id: einstieg
    title: Gleise und Fensterkreuz
    blocks:
      - type: text
        text: |
          Nika und Jonas starten bei der Schatzkarte. Der erste Hinweis sagt: Folge den Gleisen. Du lernst hier, Punkte und Linien genau zu benennen.
          Danach kannst du den Weg der Karte beschreiben.
      - type: figure
        image: images/linien-arten.svg
        alt: Vier Zeichnungen untereinander. Ein Punkt A. Eine Strecke von B nach C mit zwei Endpunkten. Eine Gerade g mit Pfeilen an beiden Enden. Eine Halbgerade, die bei D beginnt und nach rechts mit einem Pfeil weitergeht.
        caption: Vier Arten von Linien. Achte auf die Enden.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: single-choice
        id: enden-der-strecke
        text: Schau auf die Strecke BC im Bild. Wie viele Enden hat sie?
        options:
          - text: Zwei Enden
            correct: true
            info: Richtig. B und C sind die beiden Endpunkte.
          - text: Ein Ende
            correct: false
            info: Ein Ende hat die Halbgerade, die bei D beginnt.
          - text: Kein Ende
            correct: false
            info: Keine Enden hat die Gerade g. Sie geht in beide Richtungen immer weiter.
        explanation: Eine Strecke hat zwei Endpunkte, darum kannst du sie messen.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/geometrische-grundbegriffe/
  - type: section
    id: erklaerung
    title: Wie heißen die Linien?
    blocks:
      - type: text
        text: |
          Ein **Punkt** ist eine genaue Stelle. Du zeichnest ihn als kleinen Punkt und nennst ihn mit einem Großbuchstaben, zum Beispiel A.
          Eine **Strecke** hat zwei Endpunkte. Sie hat eine Länge, die du messen kannst. Du schreibst Strecke BC.
          Eine **Gerade** hat keine Enden. Du zeichnest sie mit Pfeilen und nennst sie mit einem kleinen Buchstaben, zum Beispiel g.
          Eine **Halbgerade** beginnt in einem Punkt und geht nur in eine Richtung weiter.
      - type: table
        caption: Punkt, Strecke, Gerade und Halbgerade im Vergleich
        header: [Name, Enden, Schreibweise]
        rowHeaders: true
        rows:
          - [Punkt, kein Ende, Großbuchstabe A]
          - [Strecke, zwei Enden, Strecke BC]
          - [Halbgerade, ein Ende, vom Anfangspunkt D aus]
          - [Gerade, kein Ende, kleiner Buchstabe g]
      - type: definition
        term: Strecke
        explanation: Eine Strecke ist die gerade Verbindung zwischen zwei Punkten. Sie endet in beiden Punkten und hat eine Länge.
      - type: text
        text: |
          Alle Punkte und Linien liegen in einer **Ebene**. Denke an ein Blatt Papier, das du dir nach allen Seiten unendlich groß vorstellst.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Nur eine Strecke kannst du messen. Eine Gerade hat keine Enden und damit keine Länge.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Gleise und Bahnhöfe
        blocks:
          - type: text
            text: Die Schienen sehen in der Ferne unendlich lang aus. Sie zeigen eine Gerade. Die Entfernung zwischen zwei Bahnhöfen ist eine Strecke, denn sie hat zwei Endpunkte.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: alltag-zuordnen
        text: Welcher Begriff passt? Ordne zu.
        pairs:
          - { left: Die Spitze eines Bleistifts, right: Punkt }
          - { left: Die Strecke zwischen zwei Eckfahnen eines Spielfelds, right: Strecke }
          - { left: "Gleise, die in der Ferne nie enden", right: Gerade }
          - { left: "Der Lichtstrahl einer Taschenlampe, der in einem Punkt beginnt", right: Halbgerade }
        explanation: Achte darauf, wie viele Enden die Linie hat. Zwei Enden sind eine Strecke, eins eine Halbgerade und keins eine Gerade.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/geometrische-grundbegriffe/
      - type: multiple-choice
        id: gerade-stimmt
        text: Welche Aussagen über eine Gerade stimmen?
        options:
          - text: Sie hat keine Endpunkte.
            correct: true
            info: Richtig. Eine Gerade geht in beide Richtungen weiter.
          - text: Du kannst ihre Länge messen.
            correct: false
            info: Messen kannst du nur eine Strecke. Eine Gerade hat keine Enden.
          - text: Du nennst sie mit einem kleinen Buchstaben, zum Beispiel g.
            correct: true
            info: Richtig. Punkte bekommen Großbuchstaben, Geraden kleine Buchstaben.
          - text: Sie hat genau zwei Endpunkte.
            correct: false
            info: Zwei Endpunkte hat eine Strecke.
        explanation: Eine Gerade hat keine Enden. Darum hat sie keine Länge, und du nennst sie mit einem kleinen Buchstaben.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/geometrische-grundbegriffe/
      - type: generated
        id: strecken-zaehlen
        given:
          n: { int: [4, 8], step: 1 }
        task:
          text: "Auf einer Geraden liegen {{n}} Punkte. Du zeichnest alle Strecken zwischen je zwei dieser Punkte. Wie viele verschiedene Strecken sind das?"
        answer: { value: "n * (n - 1) / 2", compare: number }
        mistakes:
          - {
              value: "n",
              message: "Das ist die Anzahl der Punkte. Eine Strecke gehört zu zwei Punkten, also gibt es mehr Strecken als Punkte.",
            }
          - {
              value: "n - 1",
              message: "Das sind nur die Strecken zwischen Nachbarpunkten. Auch zwischen Punkten mit Abstand gibt es Strecken.",
            }
          - {
              value: "n * (n - 1)",
              message: "Du hast jede Strecke doppelt gezählt: Strecke AB und Strecke BA sind dieselbe Strecke.",
            }
        hint: "Der erste Punkt hat Strecken zu allen anderen. Der zweite Punkt hat neue Strecken zu allen übrigen."
        steps:
          - "Jeder der {{n}} Punkte hat Strecken zu den anderen {{n}} − 1 Punkten. Das sind {{n}} · ({{n}} − 1) Strecken, jede doppelt gezählt."
          - "Teile durch 2: Es sind {{answer}} Strecken."
