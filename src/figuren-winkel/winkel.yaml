# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Winkel messen und zeichnen
description: Winkel als Drehung verstehen, mit dem Geodreieck messen, zeichnen und nach ihrer Größe einteilen.
competencies: [winkel-messen]
blocks:
  - type: section
    id: einstieg
    title: Eine Tür und ein Zeiger
    blocks:
      - type: text
        text: |
          Nika und Jonas lesen den fünften Hinweis ihrer Schatzkarte: Er nennt eine Richtung als Drehung. Du lernst hier, Winkel zu messen, zu zeichnen und nach ihrer Größe einzuteilen.
          Eine Tür oder der Zeiger einer Uhr zeigen dir, was ein Winkel ist.
      - type: figure
        image: images/tuer-drehung.svg
        alt: Eine Tür dreht sich um ihre Angel. Eine gestrichelte Linie zeigt die geschlossene Tür, eine rote Linie die senkrecht dazu geöffnete Tür, ein blauer Bogen die Drehung dazwischen.
        caption: Die Tür dreht sich um die Angel. Der Bogen zeigt, wie weit.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: single-choice
        id: viertel-drehung
        text: Der Minutenzeiger einer Uhr macht in 60 Minuten eine ganze Drehung. Wie viele Minuten braucht er für eine Vierteldrehung?
        options:
          - text: 15 Minuten
            correct: true
            info: Richtig. Ein Viertel von 60 Minuten sind 15 Minuten.
          - text: 30 Minuten
            correct: false
            info: Das ist eine halbe Drehung.
          - text: 45 Minuten
            correct: false
            info: Das sind drei Viertel einer Drehung.
        explanation: Eine Vierteldrehung ist ein Viertel einer ganzen Drehung. Sie ist ein rechter Winkel.
  - type: section
    id: erklaerung
    title: Winkel und Grad
    blocks:
      - type: text
        text: |
          Wenn du eine Richtung oder eine Drehung genau angeben willst, brauchst du ein Maß dafür: den Winkel.
          Ein **Winkel** entsteht, wenn sich ein Schenkel um einen Punkt dreht, den **Scheitel**.
          Du misst Winkel in **Grad** (°). Eine ganze Drehung sind 360°, eine halbe 180°, eine Vierteldrehung 90°.
      - type: definition
        term: Winkel
        explanation: Ein Winkel zeigt, wie weit sich ein Schenkel um den Scheitel dreht. Der Scheitel ist der Punkt, in dem beide Schenkel beginnen.
      - type: figure
        image: images/winkelarten.svg
        alt: Fünf Winkel nebeneinander. Spitz ist kleiner als ein rechter Winkel, recht ist ein Viertel einer Drehung, stumpf liegt dazwischen und der gestreckte Winkel, dann kommt der überstumpfe Winkel.
        caption: Fünf Winkelarten, von klein nach groß.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Winkelarten
        header: [Art, Größe]
        rows:
          - [spitz, kleiner als 90°]
          - [recht, genau 90°]
          - [stumpf, größer als 90° und kleiner als 180°]
          - [gestreckt, genau 180°]
          - [überstumpf, größer als 180° und kleiner als 360°]
      - type: text
        text: |
          Zum Messen legst du die Nullkante des Geodreiecks auf einen Schenkel. Der Scheitel liegt genau auf dem Mittelpunkt. Das Geodreieck hat zwei Skalen: Du liest die ab, die an diesem Schenkel bei 0 beginnt.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Ein Winkel von 50°
        blocks:
          - type: text
            text: |
              Ein Winkel von 50° ist kleiner als 90°, also ist er spitz. Wenn du ihn zeichnen willst, gehst du so vor:
              1. Zeichne den ersten Schenkel und markiere den Scheitel.
              2. Lege die Nullkante des Geodreiecks auf den Schenkel, den Mittelpunkt auf den Scheitel.
              3. Setze bei 50 auf der Skala, die an diesem Schenkel bei 0 beginnt, einen Punkt.
              4. Verbinde den Scheitel mit dem Punkt. Das ist der zweite Schenkel.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: vue-component
        id: winkel-ablesen
        component: WinkelAblesen
        props:
          task: Das Bild zeigt ein Geodreieck als Halbkreis mit zwei Skalen. Der erste Schenkel liegt rechts auf der 0 der äußeren Skala. Lies den Winkel ab und gib ihn in Grad ein, zum Beispiel 40.
          label: "Winkel in Grad"
          picture: Ein Halbkreis mit einer Skala von 0 bis 180 Grad und einem eingezeichneten Winkel, dessen erster Schenkel nach rechts zeigt.
          mistakes:
            - "Du hast auf der falschen Skala abgelesen. Der erste Schenkel liegt auf der 0 der äußeren Skala, also liest du dort ab."
            - "Fast: {a}° liegt in der Nähe, aber nicht genau. Lies noch einmal am Strich ab, an dem der Schenkel endet."
        examples:
          accepted:
            - { answer: 110, seed: 1 }
          rejected:
            - { answer: 70, seed: 1 }
            - { answer: 105, seed: 1 }
            - { answer: 0 }
      - type: ordering
        id: winkel-zeichnen
        text: Bringe die Schritte in die richtige Reihenfolge. Du zeichnest einen Winkel von 70°.
        items:
          - Zeichne den ersten Schenkel und markiere den Scheitel.
          - Lege die Nullkante des Geodreiecks auf den Schenkel und den Mittelpunkt auf den Scheitel.
          - Setze bei 70 auf der Skala, die bei 0 am ersten Schenkel beginnt, einen Punkt.
          - Verbinde den Scheitel mit dem Punkt.
        explanation: Erst brauchst du den ersten Schenkel. Dann richtest du das Geodreieck aus und markierst den Wert. Zum Schluss zeichnest du den zweiten Schenkel.
      - type: matching
        id: winkelart
        text: Welche Winkelart passt zur Größe?
        pairs:
          - { left: "30°", right: spitz }
          - { left: "90°", right: recht }
          - { left: "135°", right: stumpf }
          - { left: "180°", right: gestreckt }
          - { left: "270°", right: überstumpf }
        explanation: Vergleiche mit 90° und 180°. Kleiner als 90° ist spitz, größer als 180° überstumpf.
      - type: generated
        id: winkel-teilen
        given:
          a: { int: [20, 80], step: 5 }
        task:
          text: "Ein gestreckter Winkel (180°) wird durch einen Schenkel in zwei Winkel geteilt. Der eine misst {{a}}°. Wie groß ist der andere in Grad?"
        answer: { value: "180 - a", compare: { number: { unit: "°" } } }
        mistakes:
          - { value: "90 - a", message: "Du hast von 90° abgezogen. Ein gestreckter Winkel ist 180° groß." }
          - {
              value: "360 - a",
              message: "Du hast von 360° abgezogen. 360° ist die ganze Drehung, der gestreckte Winkel ist nur die halbe.",
            }
        hint: "Beide Winkel zusammen ergeben den gestreckten Winkel mit 180°."
        steps:
          - "Gestreckter Winkel: 180°. Ein Teil ist {{a}}°."
          - "180° − {{a}}° = {{answer}}°."
      - type: single-choice
        id: winkelart-120
        text: Welche Art Winkel ist ein Winkel von 120°?
        options:
          - text: stumpf
            correct: true
            info: Richtig. 120° liegt zwischen 90° und 180°.
          - text: spitz
            correct: false
            info: Spitze Winkel sind kleiner als 90°.
          - text: überstumpf
            correct: false
            info: Überstumpfe Winkel sind größer als 180°.
        explanation: Stumpfe Winkel liegen zwischen 90° und 180°.
