# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Parallelen, Senkrechten und Abstand
description: Parallele und senkrechte Geraden zeichnen und Abstände messen.
competencies: [parallel-senkrecht-abstand]
blocks:
  - type: section
    id: einstieg
    title: Zwei Gleise, die sich nie treffen
    blocks:
      - type: text
        text: |
          Der zweite Hinweis liegt zwischen zwei Gleisen. Du kannst danach parallele und senkrechte Geraden zeichnen und den Abstand zwischen ihnen messen.
          Das baut auf Punkt, Strecke und Gerade der Seite davor auf.
      - type: figure
        image: images/abstand.svg
        alt: Zwei waagerechte Geraden g und h auf einem Gitter. Auf g liegt der Punkt A, auf h liegt der Punkt B. A und B sind durch eine gestrichelte schräge Strecke verbunden.
        caption: Zwei Geraden g und h auf einem Gitter. Die Linien laufen in dieselbe Richtung.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: single-choice
        id: abstand-ablesen
        text: Wie viele Kästchen ist h von g entfernt? Gemessen wird so, dass der Weg am kürzesten ist.
        options:
          - text: 3 Kästchen
            correct: true
            info: Richtig. Gerade nach unten von g zu h sind es 3 Kästchen.
          - text: 4 Kästchen
            correct: false
            info: Das sind 4 Kästchen nach rechts. Nach rechts bleibst du auf der Höhe von g oder h.
          - text: 7 Kästchen
            correct: false
            info: Das sind der Weg nach rechts (4) und der Weg nach unten (3) zusammen. Gesucht ist nur der gerade Weg von g nach h.
        explanation: Der kürzeste Weg von g nach h geht gerade nach unten, also im rechten Winkel zu beiden Geraden.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/parallel-senkrecht-abstand/
  - type: section
    id: erklaerung
    title: Parallel, senkrecht, Abstand
    blocks:
      - type: text
        text: |
          Zwei Geraden sind **parallel**, wenn sie überall gleich weit auseinander liegen. Sie treffen sich nie. Du schreibst g ∥ h.
          Zwei Geraden sind **senkrecht** zueinander, wenn sie einen rechten Winkel bilden, also eine Ecke wie bei einem Blatt Papier. Du schreibst g ⊥ h. Zum Zeichnen benutzt du das **Geodreieck**: ein Dreieck mit einer Skala an der langen Kante und einer Mittellinie, die senkrecht dazu steht.
          Der **Abstand** zweier paralleler Geraden ist die kürzeste Strecke zwischen ihnen. Sie steht senkrecht auf beiden. Schräg gemessen ist der Weg immer länger.
      - type: definition
        term: Abstand
        explanation: Die senkrecht gemessene Entfernung zweier paralleler Geraden.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Gemessen wird immer senkrecht. Wer schräg misst, bekommt einen zu großen Abstand.
  - type: section
    id: beispiel
    title: Eine Parallele zeichnen
    blocks:
      - type: example
        title: Parallele und Senkrechte durch den Punkt P
        blocks:
          - type: text
            text: |
              **Parallele zu g durch P:**
              1. Lege die lange Kante des Geodreiecks an g.
              2. Lege ein Lineal an eine kurze Kante des Geodreiecks und halte es fest.
              3. Schiebe das Geodreieck am Lineal entlang, bis seine lange Kante an P liegt.
              4. Zeichne an der langen Kante entlang eine Linie durch P.

              **Senkrechte zu g durch P:**
              1. Lege die Mittellinie des Geodreiecks genau auf g. Sie steht senkrecht zur langen Kante.
              2. Schiebe das Geodreieck an g entlang, bis seine lange Kante an P liegt.
              3. Zeichne an der langen Kante entlang eine Linie durch P.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: ordering
        id: parallele-schritte
        text: Bringe die Schritte in die richtige Reihenfolge. Du zeichnest eine Parallele zu g durch P.
        items:
          - Lege die lange Kante des Geodreiecks an g.
          - Lege ein Lineal an eine kurze Kante des Geodreiecks.
          - Schiebe das Geodreieck am Lineal entlang, bis die lange Kante an P liegt.
          - Zeichne an der langen Kante entlang eine Linie durch P.
        explanation: Zuerst richtest du die lange Kante an g aus. Das Lineal hält die Richtung fest, während du das Geodreieck verschiebst. Zum Schluss zeichnest du.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/parallel-senkrecht-abstand/
      - type: ordering
        id: senkrechte-schritte
        text: Bringe die Schritte in die richtige Reihenfolge. Du zeichnest eine Senkrechte zu g durch P.
        items:
          - Lege die Mittellinie des Geodreiecks genau auf g.
          - Schiebe das Geodreieck an g entlang, bis die lange Kante an P liegt.
          - Zeichne an der langen Kante entlang eine Linie durch P.
        explanation: Die Mittellinie steht senkrecht zur langen Kante. Liegt sie auf g, ist die lange Kante senkrecht zu g. Dann musst du das Geodreieck nur noch bis P schieben.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/parallel-senkrecht-abstand/
      - type: multiple-choice
        id: senkrecht-beispiele
        text: Welche Paare sind senkrecht zueinander?
        options:
          - text: Die senkrechte Türkante und der Boden
            correct: true
            info: Richtig. Die Tür steht im rechten Winkel zum Boden.
          - text: Zwei Gleise
            correct: false
            info: Gleise laufen parallel. Sie treffen sich nie und bilden keinen Winkel.
          - text: Die beiden Linien eines Fensterkreuzes
            correct: true
            info: Richtig. Sie bilden ein Kreuz mit rechten Winkeln.
          - text: Zwei gegenüberliegende Kanten eines Blattes
            correct: false
            info: Gegenüberliegende Kanten sind parallel.
        explanation: Senkrechte Geraden bilden einen rechten Winkel. Parallele Geraden liegen überall gleich weit auseinander.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/parallel-senkrecht-abstand/
      - type: generated
        id: abstand-messen
        given:
          d: { int: [3, 8], step: 1 }
          s: { int: [5, 12], step: 1 }
        where: ["s > d"]
        task:
          text: "Zwei parallele Geraden g und h. Nika misst von A auf g senkrecht bis h und liest {{d}} cm ab. Sie misst auch schräg von A bis zu einem Punkt auf h und liest {{s}} cm ab. Wie groß ist der Abstand von g und h in cm?"
        answer: { value: "d", compare: { number: { unit: cm } } }
        mistakes:
          - { value: "s", message: "Das ist die schräge Strecke. Der Abstand wird senkrecht gemessen und ist kürzer." }
          - { value: "d + s", message: "Du hast die beiden Längen addiert. Der Abstand ist nur die senkrechte Länge." }
        hint: "Der Abstand ist die kürzeste Strecke zwischen den Geraden. Welche Messung ist kürzer?"
        steps:
          - "Die senkrechte Messung ist {{d}} cm, die schräge {{s}} cm. Der Abstand ist die kürzere, also {{answer}} cm."
      - type: single-choice
        id: zeichen-bedeutung
        text: Was bedeutet g ⊥ h?
        options:
          - text: g und h sind senkrecht zueinander.
            correct: true
            info: Richtig. Das Zeichen ⊥ steht für einen rechten Winkel.
          - text: g und h sind parallel.
            correct: false
            info: Parallel schreibst du mit ∥, zwei senkrechten Strichen nebeneinander.
          - text: g und h sind gleich lang.
            correct: false
            info: Geraden haben keine Länge. Das Zeichen sagt etwas über ihre Lage.
        explanation: ⊥ heißt senkrecht, ∥ heißt parallel.
        links:
          - title: Mehr zu diesem Baustein (Lernlandkarte auf lernapps.net)
            url: https://lernapps.net/apps/map/mathematik/c/parallel-senkrecht-abstand/
